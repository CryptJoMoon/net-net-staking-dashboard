name: Update staking ledger
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staking-ledger
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/snapshot.json; then exit 0; fi
          git config user.name "netnet-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/snapshot.json
          git commit -m "data: update staking ledger snapshot"
          git push
