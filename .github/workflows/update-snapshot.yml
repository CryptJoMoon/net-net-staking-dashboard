name: Update staking ledger
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/indexer.js'
      - '.github/workflows/update-snapshot.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staking-ledger
  # Never allow an older checkout to rebase a stale snapshot over newer
  # indexer code. A fresh run starts from the newest main commit.
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build snapshot with retries
        run: |
          for attempt in 1 2 3; do
            if npm run snapshot; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Snapshot attempt $attempt failed; retrying in 30 seconds..."
              sleep 30
            fi
          done
          exit 1
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/snapshot.json; then exit 0; fi
          # Attribute automated data commits to the repository owner so Vercel's
          # Git integration recognizes an authorized project contributor.
          git config user.name "CryptJoMoon"
          git config user.email "CryptJoMoon@users.noreply.github.com"
          git add public/snapshot.json
          git commit -m "data: update staking ledger snapshot"
          # Source changes can land while the multi-minute holder scan runs.
          # Rebase the generated snapshot commit before pushing it.
          git pull --rebase origin main
          git push
